<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>합쳐라! 친구 진화 게임</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gamja+Flower&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Jua',"Apple SD Gothic Neo",sans-serif;background:linear-gradient(180deg,#bfe9ff,#ffe9f0);color:#2a3550;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;user-select:none}
  #head{width:min(420px,100vw);display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
  #title{font-family:'Black Han Sans',sans-serif;font-size:22px;letter-spacing:-.5px;
    background:linear-gradient(90deg,#ff6b8a,#ffab3d 45%,#3aa0ff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(1px 2px 0 rgba(255,255,255,.8)) drop-shadow(0 3px 6px rgba(120,140,200,.35))}
  #score{font-family:'Jua',sans-serif;font-size:16px;background:rgba(255,255,255,.85);padding:7px 15px;border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);border:2px solid #fff}
  #score b{color:#ff5a7d;font-size:18px}
  #pname{color:#3a6bd4;font-weight:800}
  #quitBtn{background:#ff6b8a;color:#fff;border:none;border-radius:14px;padding:6px 13px;font-family:'Jua',sans-serif;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(255,107,138,.35)}
  #liveRank{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:76%;max-width:300px;
    background:rgba(255,255,255,.72);border:2px solid #fff;border-radius:14px;padding:8px 12px;
    box-shadow:0 4px 12px rgba(120,150,200,.2);pointer-events:none;font-family:'Jua',sans-serif;z-index:2}
  #liveRank h4{font-size:13px;color:#3a6bd4;text-align:center;margin-bottom:4px}
  #liveRank .lr{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 2px;color:#4a5570}
  #liveRank .lr b{color:#ff5a7d}
  #wrap{position:relative;width:min(420px,100vw)}
  canvas{display:block;background:linear-gradient(180deg,#d6f2ff 0%,#eafaf0 60%,#d6f0c8 100%);border-radius:14px;
    border:3px solid #ffffff;box-shadow:0 6px 20px rgba(120,160,200,.25);touch-action:none}
  #line{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(255,107,138,.5);pointer-events:none}
  #next{width:min(420px,100vw);display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;color:#5a6b8a;font-weight:600}
  #chain{display:flex;gap:3px;flex-wrap:wrap;font-size:17px}
  #over{position:absolute;inset:0;background:rgba(255,255,255,.92);border-radius:14px;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
  #over h2{font-size:26px;color:#2a3550} #over p{color:#5a6b8a;font-size:14px}
  .btn{background:linear-gradient(90deg,#7aa2ff,#9a7aff);color:#fff;border:none;padding:12px 30px;
    border-radius:24px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(122,162,255,.4)}
  #hint{font-size:13px;color:#7a89a3;padding:4px}
  /* 시작 화면 */
  #start{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#bfe9ff,#ffd9e6);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  #start .big{font-family:'Black Han Sans',sans-serif;font-size:40px;line-height:1.15;
    background:linear-gradient(90deg,#ff6b8a,#ffab3d 45%,#3aa0ff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(2px 3px 0 #fff) drop-shadow(0 5px 10px rgba(120,140,200,.4))}
  #start .subt{font-family:'Gamja Flower',cursive;font-size:20px;color:#5a6b8a}
  #start .emojis{font-size:30px;letter-spacing:2px}
  #nick{font-family:'Jua',sans-serif;font-size:18px;text-align:center;padding:14px 18px;border-radius:16px;
    border:3px solid #ffb0c4;background:#fff;color:#2a3550;width:min(300px,80vw);outline:none}
  .rankbox{background:rgba(255,255,255,.85);border-radius:16px;padding:14px 18px;width:min(320px,86vw);
    max-height:44vh;overflow:auto;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.1)}
  .rankbox h3{font-family:'Jua',sans-serif;color:#3a6bd4;margin-bottom:8px}
  .rk{display:flex;justify-content:space-between;padding:6px 4px;font-family:'Jua',sans-serif;border-bottom:1px dashed #e3e8f0}
  .rk .r1{color:#ff8c1a} .rk b{color:#ff5a7d}
  .btn2{background:#fff;color:#3a6bd4;border:2px solid #7aa2ff;padding:10px 22px;border-radius:20px;
    font-family:'Jua',sans-serif;font-size:15px;cursor:pointer}
  /* 최종 진화 축하 연출 */
  #quitConfirm{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,16,30,.5)}
  #quitConfirm .qbox{background:#fff;border-radius:18px;padding:22px 24px;text-align:center;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #quitConfirm .qbox p{font-family:'Jua',sans-serif;font-size:17px;color:#2a3550;margin-bottom:16px;line-height:1.5}
  #quitConfirm .qbox p span{font-size:13px;color:#7a89a3}
  #quitConfirm .qrow{display:flex;gap:10px;justify-content:center}
  #quitConfirm .btn,#quitConfirm .btn2{padding:10px 22px}
  #flash{position:fixed;inset:0;z-index:38;pointer-events:none;background:#fff;opacity:0}
  #flash.go{animation:flash .45s ease}
  @keyframes flash{0%{opacity:0}20%{opacity:.7}100%{opacity:0}}
  #celebrate{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,220,240,.15))}
  #cEmo{font-size:130px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.28))}
  #cEmo.spin{animation:finSpin 2s cubic-bezier(.2,.8,.3,1)}
  @keyframes finSpin{0%{transform:scale(0) rotate(0)}25%{transform:scale(1.35) rotate(360deg)}
    75%{transform:scale(1.1) rotate(1080deg)}100%{transform:scale(1) rotate(1440deg)}}
  #cMsg{display:none;font-family:'Black Han Sans',sans-serif;font-size:36px;margin-top:6px;
    background:linear-gradient(90deg,#ff6b8a,#ffab3d 50%,#3aa0ff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(2px 3px 0 #fff) drop-shadow(0 5px 10px rgba(120,140,200,.4));animation:popMsg .3s ease}
  @keyframes popMsg{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
  <div id="start">
    <div class="big">합쳐라!<br>친구 진화 🐭</div>
    <div class="emojis" id="startChain"></div>
    <div class="subt">같은 친구끼리 합쳐서 햄스터까지 진화시켜라!</div>
    <input id="nick" maxlength="10" placeholder="닉네임을 입력하세요 ✏️">
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="btn" style="padding:12px 22px;background:#57c46a;box-shadow:0 6px 16px rgba(87,196,106,.4)" onclick="beginGame('easy')">이지</button>
      <button class="btn" style="padding:12px 22px;background:#ffc93c;color:#6a5310;box-shadow:0 6px 16px rgba(255,201,60,.45)" onclick="beginGame('normal')">노말</button>
      <button class="btn" style="padding:12px 22px;background:#ff5a5a;box-shadow:0 6px 16px rgba(255,90,90,.4)" onclick="beginGame('hard')">하드</button>
    </div>
    <div class="subt" style="font-size:13px">이지: 여유 · 노말: 기본 · 하드: 낮은 선 + 1.5초 제한 ⏱</div>
    <button class="btn2" onclick="showRank(true)">🏆 랭킹 보기</button>
    <div id="rankStart"></div>
  </div>
  <div id="head">
    <div id="title">🎮 합쳐라!</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div id="score"><span id="pname"></span>점수 <b id="sc">0</b></div>
      <button id="quitBtn" onclick="askQuit()" style="display:none">나가기</button>
    </div>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="line"></div>
    <div id="liveRank" style="display:none"></div>
    <div id="over">
      <h2 id="overttl">게임 오버!</h2>
      <p id="overtxt"></p>
      <div id="rankOver" class="rankbox"></div>
      <button class="btn" onclick="location.reload()">다시 하기 🔄</button>
    </div>
  </div>
  <div id="flash"></div>
  <div id="quitConfirm">
    <div class="qbox">
      <p>게임을 나가시겠습니까?<br><span>점수는 이대로 기록됩니다.</span></p>
      <div class="qrow"><button class="btn2" onclick="closeQuit()">취소</button><button class="btn" onclick="doQuit()">확인</button></div>
    </div>
  </div>
  <div id="celebrate"><div id="cEmo">🐹</div><div id="cMsg">햄스터 진화 성공! 🎉</div></div>
  <div id="chain" style="padding-top:8px"></div>
  <div id="hint">화면을 눌러 떨어뜨리세요 · 같은 친구끼리 합치면 진화!</div>

const IMG = SPRITES.map(s=>{const im=new Image(); im.src=s; return im;});
IMG.forEach(im=>{im.onload=()=>{try{buildChain("chain",34);buildChain("startChain",40);}catch(e){}};});
function ring(ctx,r){ctx.lineWidth=Math.max(2,r*0.04);ctx.strokeStyle="rgba(60,60,80,.16)";ctx.beginPath();ctx.arc(0,0,r-ctx.lineWidth/2,0,7);ctx.stroke();}
function drawPiece(ctx,d,i,r){
  const img=IMG[i];
  if(img&&img.complete&&img.naturalWidth){
    const s=r*2*0.98;
    ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();
    ctx.drawImage(img,-s/2,-s/2,s,s);ctx.restore();
  }
  ring(ctx,r);
}

let LINE_Y=LINES.easy, MODE='easy', dropStart=0;
function setLine(){ document.getElementById("line").style.top=(document.getElementById("head").offsetHeight+LINE_Y)+"px"; }

const canvas=document.getElementById("c"); canvas.width=W; canvas.height=H;
const DPR=Math.min(3, window.devicePixelRatio||1);

Render.run(render); const runner=Runner.create(); Runner.run(runner,engine);

const wallOpt={isStatic:true,render:{fillStyle:"#9ed99a"}};

  Bodies.rectangle(-8,H/2,20,H*2,wallOpt),
  Bodies.rectangle(W+8,H/2,20,H*2,wallOpt),
]);

function mk(x,y,level){
  const d=L[level];
  const b=Bodies.circle(x,y,d.r,{restitution:.2,friction:.4,
    render:{fillStyle:d.col},label:"ball"});
  b.level=level; b.spawnT=Date.now(); return b;
}

let score=0, aimX=W/2, pending=rand3(), canDrop=true, gameover=false, started=false, nickname="익명";

// 동물 그리기 (원 중심 기준, 이미 col로 채워진 원 위에 큐티하게)
function drawAnimal(ctx,lv,r){
  const dark="#33333f";
  ctx.lineWidth=Math.max(2,r*0.045);ctx.strokeStyle="rgba(50,50,70,.25)";
  ctx.beginPath();ctx.arc(0,0,r-ctx.lineWidth/2,0,7);ctx.stroke();
  function eyes(dx,dy,er){for(const s of[-1,1]){
    ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(s*dx,dy,er*0.82,er,0,0,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s*dx-er*0.28,dy-er*0.42,er*0.34,0,7);ctx.fill();}}
  function blush(dx,dy,br){ctx.fillStyle="rgba(255,150,160,.55)";for(const s of[-1,1]){ctx.beginPath();ctx.arc(s*dx,dy,br,0,7);ctx.fill();}}
  function smile(y,w,col){ctx.strokeStyle=col||dark;ctx.lineWidth=r*0.05;ctx.lineCap="round";ctx.beginPath();ctx.arc(0,y,w,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  const P=Math.PI;
  if(lv===0){ // 흰오리
    eyes(r*0.3,-r*0.12,r*0.15);
    ctx.fillStyle="#ff9e33";ctx.beginPath();ctx.ellipse(0,r*0.22,r*0.34,r*0.17,0,0,7);ctx.fill();
    blush(r*0.5,r*0.16,r*0.1);
    ctx.fillStyle="#ff9e33";ctx.beginPath();ctx.ellipse(-r*0.24,r*0.8,r*0.14,r*0.07,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(r*0.24,r*0.8,r*0.14,r*0.07,0,0,7);ctx.fill();
  }else if(lv===1){ // 카피바라
    ctx.fillStyle="#9c6a3f";ctx.beginPath();ctx.arc(-r*0.55,-r*0.5,r*0.18,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.55,-r*0.5,r*0.18,0,7);ctx.fill();
    ctx.fillStyle="#a9744a";ctx.beginPath();ctx.ellipse(0,r*0.32,r*0.5,r*0.36,0,0,7);ctx.fill();
    eyes(r*0.32,-r*0.14,r*0.12);
    ctx.fillStyle="#4f3320";ctx.beginPath();ctx.arc(-r*0.15,r*0.24,r*0.055,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.15,r*0.24,r*0.055,0,7);ctx.fill();
    blush(r*0.52,r*0.06,r*0.09);
  }else if(lv===2){ // 거북이
    ctx.strokeStyle="rgba(40,95,45,.5)";ctx.lineWidth=r*0.14;ctx.beginPath();ctx.arc(0,r*0.15,r*0.6,1.2*P,1.8*P);ctx.stroke();
    eyes(r*0.28,-r*0.05,r*0.14); blush(r*0.5,r*0.15,r*0.1); smile(r*0.12,r*0.2);
  }else if(lv===3){ // 펭귄
    ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(0,r*0.2,r*0.46,r*0.55,0,0,7);ctx.fill();
    eyes(r*0.22,-r*0.2,r*0.12);
    ctx.fillStyle="#ffb03a";ctx.beginPath();ctx.moveTo(0,-r*0.02);ctx.lineTo(-r*0.12,r*0.12);ctx.lineTo(r*0.12,r*0.12);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(-r*0.22,r*0.85,r*0.13,r*0.07,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(r*0.22,r*0.85,r*0.13,r*0.07,0,0,7);ctx.fill();
  }else if(lv===4){ // 개구리
    ctx.fillStyle="#8fd47f";ctx.beginPath();ctx.arc(-r*0.36,-r*0.5,r*0.3,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.36,-r*0.5,r*0.3,0,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-r*0.36,-r*0.5,r*0.2,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.36,-r*0.5,r*0.2,0,7);ctx.fill();
    ctx.fillStyle=dark;ctx.beginPath();ctx.arc(-r*0.36,-r*0.46,r*0.095,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.36,-r*0.46,r*0.095,0,7);ctx.fill();
    smile(r*0.05,r*0.42); blush(r*0.55,r*0.2,r*0.1);
  }else if(lv===5){ // 승초딩
    ctx.fillStyle="#241d1a";ctx.beginPath();ctx.arc(0,-r*0.02,r*0.92,0.98*P,2.02*P);ctx.fill();
    ctx.beginPath();ctx.moveTo(-r*0.9,-r*0.05);ctx.quadraticCurveTo(0,-r*0.55,r*0.9,-r*0.05);ctx.quadraticCurveTo(0,-r*0.02,-r*0.9,-r*0.05);ctx.fill();
    ctx.beginPath();ctx.ellipse(-r*0.82,r*0.15,r*0.16,r*0.5,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(r*0.82,r*0.15,r*0.16,r*0.5,0,0,7);ctx.fill();
    eyes(r*0.28,r*0.12,r*0.14); blush(r*0.44,r*0.34,r*0.11); smile(r*0.3,r*0.14,"#c0605a");
  }else{ // 쥐
    ctx.fillStyle="#a49bc0";ctx.beginPath();ctx.arc(-r*0.55,-r*0.5,r*0.32,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.55,-r*0.5,r*0.32,0,7);ctx.fill();
    ctx.fillStyle="#f2c0d8";ctx.beginPath();ctx.arc(-r*0.55,-r*0.5,r*0.18,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.55,-r*0.5,r*0.18,0,7);ctx.fill();
    eyes(r*0.26,-r*0.02,r*0.14);
    ctx.fillStyle="#ff7a9c";ctx.beginPath();ctx.arc(0,r*0.2,r*0.09,0,7);ctx.fill();
    blush(r*0.5,r*0.2,r*0.1);
    ctx.strokeStyle="rgba(90,90,105,.5)";ctx.lineWidth=r*0.022;ctx.beginPath();
    ctx.moveTo(r*0.09,r*0.2);ctx.lineTo(r*0.62,r*0.1);ctx.moveTo(r*0.09,r*0.24);ctx.lineTo(r*0.62,r*0.3);
    ctx.moveTo(-r*0.09,r*0.2);ctx.lineTo(-r*0.62,r*0.1);ctx.moveTo(-r*0.09,r*0.24);ctx.lineTo(-r*0.62,r*0.3);ctx.stroke();
  }
}
function rand3(){return Math.floor(Math.random()*3);}
function setScore(v){score=v;document.getElementById("sc").textContent=score;}
function showNext(){}
showNext();

// 진화 체인을 그림으로 표시 (시작화면 + 플레이화면)
function buildChain(elId,cell){
  const box=document.getElementById(elId); if(!box)return; box.innerHTML=""; box.style.display="flex";
  box.style.flexWrap="wrap"; box.style.alignItems="center"; box.style.justifyContent="center"; box.style.gap="2px";
  L.forEach((d,i)=>{
    const cv=document.createElement("canvas"); cv.width=cell; cv.height=cell; cv.style.verticalAlign="middle";
    const x=cv.getContext("2d"); x.translate(cell/2,cell/2);
    const rr=cell/2-2; x.fillStyle=d.col; x.beginPath(); x.arc(0,0,rr,0,7); x.fill();
    drawPiece(x,d,i,rr);
    box.appendChild(cv);
    if(i<MAX){const s=document.createElement("span");s.textContent="▶";s.style.cssText="color:#7aa2ff;font-size:11px;margin:0 1px";box.appendChild(s);}
  });
}
buildChain("chain",34);
buildChain("startChain",40);
// 저장된 닉네임 자동 채우기
try{const _sn=localStorage.getItem("mergeNick"); if(_sn)document.getElementById("nick").value=_sn;}catch(e){}

function pointerX(e){const r=canvas.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;return Math.max(L[pending].r+4,Math.min(W-L[pending].r-4,cx));}
canvas.addEventListener("pointermove",e=>{aimX=pointerX(e);});
canvas.addEventListener("pointerdown",e=>{aimX=pointerX(e);drop();});

function drop(){
  if(!started||!canDrop||gameover)return; canDrop=false;
  const b=mk(aimX,DROP_Y,pending); Composite.add(engine.world,b);
  pending=rand3(); showNext();
  setTimeout(readyDrop,480);
}

// 병합
const merging=new Set();
Events.on(engine,"collisionStart",ev=>{
  for(const {bodyA,bodyB} of ev.pairs){
    if(bodyA.label!=="ball"||bodyB.label!=="ball")continue;
    if(bodyA.level!==bodyB.level)continue;
    if(merging.has(bodyA.id)||merging.has(bodyB.id))continue;
    const lv=bodyA.level;
    merging.add(bodyA.id);merging.add(bodyB.id);
    const mx=(bodyA.position.x+bodyB.position.x)/2, my=(bodyA.position.y+bodyB.position.y)/2;
    Composite.remove(engine.world,bodyA);Composite.remove(engine.world,bodyB);
    if(lv<MAX){
      const nb=mk(mx,my,lv+1);Composite.add(engine.world,nb);
      setScore(score+L[lv+1].sc);
      pop(mx,my,L[lv+1].col);
      if(lv+1===MAX) celebrateFrog();   // 개구리 완성 축하 연출
    }else{
      setScore(score+120); pop(mx,my,"#ff6b8a"); ratBoom(mx,my); // 쥐+쥐 = 색종이 폭발!
    }
    setTimeout(()=>{merging.delete(bodyA.id);merging.delete(bodyB.id);},50);
  }
});

// 이모지/이름 그리기 + 팝 이펙트
let pops=[], confetti=[], floats=[];
function pop(x,y,c){pops.push({x,y,r:6,a:1,c});}
function ratBoom(x,y){
  const cols=["#ff6b8a","#ffd23f","#7aa2ff","#7bd88f","#c9a0ff","#ff9e33"];
  for(let i=0;i<30;i++)confetti.push({x,y,vx:(Math.random()-0.5)*10,vy:Math.random()*-9-2,g:0.38,life:1,c:cols[i%cols.length],s:4+Math.random()*4,rot:Math.random()*6});
  floats.push({x,y,t:"+120 🎉",life:1});
  const f=document.getElementById("flash"); if(f){f.classList.remove("go");void f.offsetWidth;f.classList.add("go");}
}
Events.on(render,"afterRender",()=>{
  const ctx=render.context;
  for(const b of Composite.allBodies(engine.world)){
    if(b.label!=="ball")continue;
    const d=L[b.level];
    ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
    drawPiece(ctx,d,b.level,d.r);
    ctx.restore();
  }
  // 조준선
  if(canDrop&&!gameover){
    ctx.save();ctx.globalAlpha=.3;ctx.strokeStyle="#5a6b8a";ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.moveTo(aimX,DROP_Y+L[pending].r);ctx.lineTo(aimX,H);ctx.stroke();
    ctx.restore();
    ctx.save();ctx.globalAlpha=.9;ctx.translate(aimX,DROP_Y);
    ctx.fillStyle=L[pending].col;ctx.beginPath();ctx.arc(0,0,L[pending].r,0,7);ctx.fill();
    drawPiece(ctx,L[pending],pending,L[pending].r);ctx.restore();
    if(MODE==="hard"){
      const rem=1.5-(Date.now()-dropStart)/1000;
      if(rem<=0){ drop(); }
      else{ ctx.save();ctx.fillStyle=rem<2?"#ff3b3b":"#ff8c1a";ctx.font="bold 22px 'Jua',sans-serif";
        ctx.textAlign="center";ctx.strokeStyle="#fff";ctx.lineWidth=4;
        ctx.strokeText("⏱ "+Math.ceil(rem),W-34,28);ctx.fillText("⏱ "+Math.ceil(rem),W-34,28);ctx.restore(); }
    }
  }
  pops=pops.filter(p=>p.a>0);
  for(const p of pops){ctx.save();ctx.globalAlpha=p.a;ctx.strokeStyle=p.c;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();ctx.restore();p.r+=3;p.a-=0.06;}
  confetti=confetti.filter(p=>p.life>0);
  for(const p of confetti){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life-=0.018;p.rot+=0.25;
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);ctx.restore();}
  floats=floats.filter(f=>f.life>0);
  for(const f of floats){f.y-=1.3;f.life-=0.02;
    ctx.save();ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle="#ff5a7d";ctx.font="bold 26px 'Jua',sans-serif";
    ctx.textAlign="center";ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.strokeText(f.t,f.x,f.y);ctx.fillText(f.t,f.x,f.y);ctx.restore();}
});

// 게임오버 체크: 라인 위로 넘어간 공이 머물면 종료
let overTimer=0;
Events.on(engine,"afterUpdate",()=>{
  if(gameover||!started)return;
  const now=Date.now();
  let danger=false;
  for(const b of Composite.allBodies(engine.world)){
    if(b.label!=="ball")continue;
    // 갓 떨어진(또는 방금 합쳐진) 공은 유예: 낙하 중엔 라인 위를 지나가도 안 셈
    if(now - (b.spawnT||0) < 1100) continue;
    const top=b.position.y - L[b.level].r;
    // 유예 지난 공의 윗면이 라인 위에 있고, 격하게 튀는 중이 아니면 위험
    if(top < LINE_Y && Math.abs(b.velocity.y) < 2.4){ danger=true; break; }
  }
  overTimer = danger ? overTimer+1 : Math.max(0, overTimer-3);
  if(overTimer>50){ endGame(); }
});
async function endGame(){
  if(gameover)return;
  gameover=true;
  document.getElementById("quitBtn").style.display="none";
  saveLocal(nickname,MODE,score);
  document.getElementById("overtxt").innerHTML=nickname+" 님의 최종 점수 ("+MODE_LABEL[MODE]+") <b style='color:#ff6b8a'>"+score+"</b>점<br>"+
    (score>=300?"햄스터까지 진화 완료?! 최종 보스 등극 🐭":score>=120?"오 좀 하는데? 🐧":"다시 도전! ✨");
  document.getElementById("rankOver").innerHTML="<h3>🏆 랭킹 TOP</h3><div class='rk'>저장 중…</div>";
  document.getElementById("over").style.display="flex";
  await cloudSave(nickname,MODE,score);
  refreshRanks();
}

// ===== 최종 진화 축하 =====
function celebrateFrog(){
  canDrop=false;
  const el=document.getElementById("celebrate"),emo=document.getElementById("cEmo"),msg=document.getElementById("cMsg");
  el.style.display="flex"; msg.style.display="none";
  emo.style.display="block"; emo.classList.remove("spin"); void emo.offsetWidth; emo.classList.add("spin");
  setTimeout(()=>{ emo.style.display="none"; msg.style.display="block"; },2000);
  setTimeout(()=>{ el.style.display="none"; if(!gameover)readyDrop(); },3000);
}

// ===== 닉네임 / 시작 =====
function readyDrop(){ canDrop=true; dropStart=Date.now(); }
function askQuit(){ if(gameover)return; document.getElementById("quitConfirm").style.display="flex"; }
function closeQuit(){ document.getElementById("quitConfirm").style.display="none"; }
function doQuit(){ closeQuit(); endGame(); }
function beginGame(mode){
  MODE=mode||'easy'; LINE_Y=LINES[MODE]; setLine();
  const v=(document.getElementById("nick").value||"").trim();
  nickname = v || ("익명"+["오리","펭귄","거북이","햄스터"][Math.floor(Math.random()*4)]);
  try{localStorage.setItem("mergeNick",nickname);}catch(e){}
  document.getElementById("pname").textContent=nickname+" · ";
  started=true; dropStart=Date.now();
  document.getElementById("start").style.display="none";
  document.getElementById("quitBtn").style.display="block";
  renderLiveRank();
}

// ===== 랭킹: Supabase 공유 랭킹 + 로컬 폴백 =====
const CLOUD={url:"https://nbluiiyhummayvazjcns.supabase.co",key:"sb_publishable_EnCKKpTIKPywBr74Nb8Xig_sVzpZHCa"};
function hdr(){return {apikey:CLOUD.key,Authorization:"Bearer "+CLOUD.key};}
function loadRank(mode){ try{return JSON.parse(localStorage.getItem("mergeRank_"+mode)||"[]");}catch(e){return [];} }
function saveLocal(n,mode,s){ const r=loadRank(mode);const ex=r.find(e=>e.n===n);
  if(ex){if(s>ex.s)ex.s=s;}else r.push({n,s}); r.sort((a,b)=>b.s-a.s);
  try{localStorage.setItem("mergeRank_"+mode,JSON.stringify(r.slice(0,50)));}catch(e){} }
async function cloudSave(n,mode,s){
  try{
    const r=await fetch(`${CLOUD.url}/rest/v1/scores?nick=eq.${encodeURIComponent(n)}&mode=eq.${mode}&select=score`,{headers:hdr()});
    const cur=await r.json();
    if(Array.isArray(cur)&&cur.length&&cur[0].score>=s) return;
    await fetch(`${CLOUD.url}/rest/v1/scores?on_conflict=nick,mode`,{method:"POST",
      headers:{...hdr(),"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify({nick:n,mode:mode,score:s})});
  }catch(e){}
}
async function cloudTop(mode){
  try{const r=await fetch(`${CLOUD.url}/rest/v1/scores?mode=eq.${mode}&select=nick,score&order=score.desc&limit=10`,{headers:hdr()});
    const d=await r.json(); if(Array.isArray(d)) return d.map(e=>({n:e.nick,s:e.score}));}catch(e){}
  return null;
}
async function getTop(mode){ const c=await cloudTop(mode); return c || loadRank(mode); }
function paintRank(id,data,big,title){
  const box=document.getElementById(id); if(!box)return;
  const medal=["🥇","🥈","🥉"];
  const head=(big?"<h3>🏆 ":"<h4>🏆 ")+(title||"랭킹")+(big?"</h3>":"</h4>");
  if(!data||!data.length){ box.innerHTML=head+`<div class="${big?'rk':'lr'}">아직 기록이 없어요!</div>`;return; }
  const n=big?10:5, cls=big?"rk":"lr";
  box.innerHTML=head+data.slice(0,n).map((e,i)=>
    `<div class="${cls}"><span class="${i<3&&big?'r1':''}">${medal[i]||(i+1)+"위"} ${e.n}</span><b>${e.s}${big?'점':''}</b></div>`).join("");
}
async function refreshRanks(){ const t=await getTop(MODE); if(document.getElementById("rankOver")) paintRank("rankOver",t,true,MODE_LABEL[MODE]+" 랭킹 TOP"); }
function renderLiveRank(){ const b=document.getElementById("liveRank"); if(b)b.style.display="none"; }
async function showRank(){
  const box=document.getElementById("rankStart");
  if(box.innerHTML){ box.innerHTML=""; return; } // 토글
  box.className="rankbox"; box.innerHTML="<div class='rk'>불러오는 중…</div>";
  const medal=["🥇","🥈","🥉"]; let html="";
  for(const m of ["easy","normal","hard"]){
    const t=await getTop(m);
    html+=`<h3>${MODE_LABEL[m]} 랭킹</h3>`;
    html+=(t&&t.length)? t.slice(0,5).map((e,i)=>
      `<div class="rk"><span class="${i<3?'r1':''}">${medal[i]||(i+1)+"위"} ${e.n}</span><b>${e.s}점</b></div>`).join("")
      : "<div class='rk'>아직 기록 없음</div>";
  }
  box.innerHTML=html;
}
